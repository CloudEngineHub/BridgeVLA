exp_id: real_dobot_zed_0502
# Which task_group directories under data_root to include: "all", or a comma-separated list such as
# "plate_tasks,shelf_tasks,drawer_tasks".
tasks: all
# NOTE: small batches can trigger a cuBLAS FPE inside PaliGemma with bf16 weights; bs=4 per GPU is the verified minimum.
bs: 4
num_workers: 4
# 667 "long" epochs (was 2000 short ones) — see task_sampling.epoch_size_mult below: each epoch draws 3x
# the dataset, so 667 x 447 ≈ the old 2000 x 149 total optimizer steps.
epochs: 360
# train_iter is unused by this trainer (it iterates a DataLoader), but the key keeps yacs from complaining.
train_iter: 10000
# every 33 long epochs ≈ every 100 old short epochs, still 20 checkpoints over the run (667 // 33).
save_every_n_epochs: 20
# false (default) -> epoch + model weights only (much smaller files); true -> also store optimizer state +
# global_step + freeze_epochs so --resume_path continues exactly where it left off. Mirrors RMBench_vla.
save_optimizer_state: false
# Legacy YARR-replay-buffer knob; the real trainer streams a DataLoader and ignores it. The live knob is
# `task_sampling` below.
sample_distribution_mode: task_uniform

# --- Multi-task sampling balance (same knob as RLBench/RMBench_vla) ---
# Real_Dataset flattens episodes into a per-(episode, step) index, so a uniform sampler draws each task ∝
# its TOTAL transition count. On 7_20_real_updated that is heavily skewed: episode counts run from 2
# (put_lids_*) to 118 (RedBull_top), so put_shelf alone owns 59.8% of transitions.
#
# group_mode=category makes the balancing TWO-LEVEL, which this mix needs: the 19 task_group dirs are
# really 5 SKILLS x N language variants, and the variant count differs wildly per skill. Balancing flat
# over 19 names would give a skill a share proportional to how many nouns we happened to record. Instead:
#   1. category c drawn with p_c ∝ n_c**alpha   (temperature acts HERE)
#   2. UNIFORM across the variants inside c     (p(t|c) = 1/K_c)
#   3. uniform across that variant's transitions
# See real_dataset._TASK_CATEGORIES for the skill -> dir mapping.
#
# Measured on 7_20_real_updated (4270 transitions / 479 episodes / 19 tasks); "rep" = how many times each
# transition of that category is drawn per epoch at mult=3:
#
#   category        K  n_ep  n_trans   raw%   a=0.0  a=0.3  a=0.5  a=1.0  rep@0.3
#   put_shelf       5   319     2552  59.8%   20.0%  30.1%  38.2%  59.8%     0.5x
#   put_drawer      8    64      640  15.0%   20.0%  19.9%  19.1%  15.0%     1.3x
#   swap_eggplant   1    37      444  10.4%   20.0%  17.8%  15.9%  10.4%     1.7x
#   put_lids        3    27      378   8.9%   20.0%  17.0%  14.7%   8.9%     1.9x
#   press_button    2    32      256   6.0%   20.0%  15.1%  12.1%   6.0%     2.5x
#
# alpha=0.3 cuts put_shelf from 59.8% to 30.1% while lifting the three long-horizon memory skills from
# 25.3% to 49.9% combined, at only ~2.5x repetition for the smallest. train.py prints this exact nested
# table on rank 0 before the first epoch.
# NOTE: changing alpha OR group_mode changes the discriminator's effective positive rate — see
# memory.discriminator.pos_weight below, which is calibrated to both.
#
# epoch_size_mult=3: one epoch draws 3x len(dataset) instead of 178 steps, which was a couple of minutes
# of wall clock and made per-epoch bookkeeping fire far too often. All epoch-denominated knobs below are
# scaled down 3x so TOTAL training length is unchanged (rounded, residual drift shown):
#     epochs             2000 -> 667    (298000 -> 298149 steps, +0.1%)
#     save_every_n_epochs 100 -> 33     ( 14900 ->  14751 steps, -1.0%)
#     freeze_epochs        20 -> 7      (  2980 ->   3129 steps, +5.0%)
#     viz_every_n_epochs 10000 -> 3333  (unchanged in effect; see note there)
# warmup_steps counts STEPS, not epochs -> deliberately left at 300.
task_sampling:
  mode: temperature
  alpha: 0.3
  group_mode: category   # "task" = flat over the 19 dirs; "category" = 5 skills
  epoch_size_mult: 3.0   # float — yacs enforces the default's type (1.0)

# --- Two-stage training (same recipe as RLBench): Stage 1 (epoch < freeze_epochs) freezes PaliGemma and
# trains only up0/heads; Stage 2 unfreezes it. 7 long epochs ≈ the old 20 short ones. ---
freeze_epochs: 7
# STEPS, not epochs — deliberately not scaled by epoch_size_mult. Per-stage linear warmup, so it restarts
# when PaliGemma unfreezes at freeze_epochs.
warmup_steps: 300

# --- PaliGemma activation (gradient) checkpointing ---
# True: HF gradient checkpointing (use_reentrant=False) to drop activation memory; pairs with
# memory.grad_through_tokens=true. train.py propagates it onto mvt_cfg before MVT() is built.
gradient_checkpointing: true

# --- Rotation head: 6D continuous regression (Zhou et al., CVPR 2019), mirroring RMBench ---
# "6d" -> train.py sets rot_ver=2 and feat_dim=10; the rotation is regressed as a 6D vector ->
# Gram-Schmidt -> SO(3), supervised by a Frobenius loss to the GT matrix. "euler_disc" keeps mvt_cfg.yaml's.
rotation_representation: "6d"

# --- Rotation/grip/collision feature source: STAGE 1 (coarse), mirroring RMBench ---
# true -> those heads read stage-1 features and stage 2 emits only the translation heatmap; translation
# precision is unchanged. false -> the original stage-2 (fine zoom) source.
feat_from_stage1: true

# --- Episodic memory (spatial anchor + temporal episodic) ---
# Mirrors mvt_cfg.memory; real/train.py propagates this block onto it before the network is built.
#   Spatial Anchor (stage1+stage2): cross-attend current PaliGemma tokens against the episode's frame-0
#     tokens. At stage 2 the anchor PC is re-rendered with the same trans_pc as the current frame.
#   Temporal Episodic (stage1 only): cross-attend against the K most-recent keyframes (per-slot index PE).
# Real_Dataset emits the anchor + K history bundles per sample, and SE3 transform_augmentation co-rotates
# them with the current cloud, so it stays ON alongside memory.
# Content = frame-0 anchor + the two most-recent EXECUTED keyframes, PLUS GT subtask-boundary keyframes
# admitted into slots 2..K-1. The real data carries those boundaries (see
# Real_Dataset._memory_boundary_steps): press-button-N-times -> the completed-press lift-up frames;
# swap-two-eggplants -> the two intermediate place-downs. The discriminator is supervised to predict them.
# Tasks with no boundary (e.g. put_lids) keep mem_label all-zero and admit nothing.
memory:
  enabled: true
  # M = max temporal memory slots (mirrors RMBench). Slots 0/1 hold the two recency keyframes; slots
  # 2..K-1 hold GT subtask-boundary keyframes, and stay masked for tasks with no boundary label.
  k_temporal: 12
  # Frame-selection policy (matches RMBench): slots 0/1 = the two most-recent executed keyframes;
  # slots 2..K-1 = GT subtask-boundary keyframes (press-completion frames for the press tasks).
  select: keyframe_gt
  spatial_at_mvt1: true
  spatial_at_mvt2: true
  temporal_at_mvt1: true
  # --- Memory ablation switches (memory only; the stage1/stage2 mvt flow is unchanged) ---
  #   temporal_memory -> stage-1 memory: the temporal block (mem_temporal_s1) + the stage-1 anchor frame
  #     (mem_spatial_s1). false -> the whole stage-1 memory is disabled, and the keyframe discriminator is
  #     force-disabled with it, keeping the ablation clean.
  #   spatial_memory  -> stage-2 memory: the local per-view anchor frame (mem_spatial_s2).
  # Disabling either appends _no_temporal_mem / _no_spatial_mem / _no_mem to the run name. The eval side
  # must declare the same switches (MEMORY_TEMPORAL / MEMORY_SPATIAL in rvt_our/eval_flask_app.py); they are
  # checked against the ckpt's dumped mvt_cfg.yaml and a mismatch aborts.
  temporal_memory: true
  spatial_memory: true
  share_spatial_across_stages: false
  heads: 8
  dim_head: 128
  num_layers: 2
  ffn_mult: 2
  use_fast_attn: false
  grad_through_tokens: true
  # --- Keyframe discriminator ---
  # Supervises out["mem_logit"] (the current frame's post-memory stage-1 tokens) with BCE against the GT
  # mem_label (is this a subtask boundary?). mem_label==1 at each task's boundaries (press tasks:
  # three_times 3/5/7, twice 3/5; swap-eggplants 4/8; put-lids-then-uncover 4/8); at eval its sigmoid gate
  # admits those frames into the extra memory slots. Coupled to temporal_memory (auto-disabled with it).
  #
  # pos_weight up-weights the positive class: put_shelf (5) and put_drawer (8) carry no boundary label and
  # contribute 3192 pure-negative transitions, so the RAW positive rate is 208/4270 = 4.87% (neg/pos 19.5).
  # What matters is the positive rate under the ACTUAL sampler, and the two-level category sampler
  # concentrates draws on the boundary-carrying skills. Calibrated at group_mode=category:
  #   alpha=0.0 -> sampled pos 12.38% -> pos_weight  7.08
  #   alpha=0.3 -> sampled pos 10.08% -> pos_weight  8.92   <-- current
  #   alpha=0.5 -> sampled pos  8.50% -> pos_weight 10.77
  #   alpha=1.0 -> sampled pos  4.85% -> pos_weight 19.60
  # RECOMPUTE whenever the task mix, episode counts, alpha OR group_mode change.
  discriminator:
    enabled: true
    input: current
    heads: 8
    hidden: 512
    loss_weight: 1.0
    pos_weight: 8.92
    threshold: 0.5

# --- Per-epoch heatmap visualization (mirrors gembench_config.yaml) ---
# Each viz epoch samples ONE episode per task and dumps, for every step, the pred+GT translation heatmaps
# plus the stage-1 / stage-2 memory grids. Gated by --visualize (default on) and --viz_per_epoch.
# NOTE: 3333 is far larger than `epochs` (667), so the periodic viz never fires — only the epoch-0
# baseline below runs. Lower this (e.g. 33) to get periodic viz.
viz_every_n_epochs: 100
# initial_viz: true -> also run the viz pass at epoch 0 (a pre-training baseline).
initial_viz: false
# One representative task per group; add any task from `tasks` above.
viz_tasks:
  - put_the_watermelon_in_the_lower_drawer
  - put_the_coke_can_in_the_top_shelf
  - swap_the_two_eggplants_on_the_plate
  - press_the_blue_button_twice_then_press_the_yellow_button

swanlab_project: "bridgevla_plus_real"
swanlab_run: "real_memory"
# Fallback only; real/train.sh overrides it with --log_dir "${BRIDGEVLA_REAL_LOG_DIR}". The ${...}
# placeholders here are expanded by train.py's real.paths.expand(), which derives from the repo location
# when the env var is unset, so plain `python real/train.py` never writes to another machine's paths.
log_dir: "${BRIDGEVLA_DATA_ROOT}/logs_real"

peract:
  lr: 3e-5
  optimizer_type: "adamw"
  weight_decay: 0.01
  betas: [0.9, 0.95]
  transform_augmentation: true
  # Fraction of SCENE_BOUNDS_REAL per axis (uniform in [-range, +range]); bounds are
  # x_len=0.86 / y_len=0.82 / z_len=0.70 m. x/y stay at 0.125; z was raised to 0.15 so the vertical
  # placement of shelf/drawer levels varies more. With rvt.place_with_mean=False the cloud is normalized
  # around the FIXED scene-bound centre, so the shift is not cancelled out (~±27px of 224 in the
  # front/right views). This is the STAGE-1 whole-cloud SE3 aug; stage-2 zoom jitter is st_wpt_loc_aug.
  transform_augmentation_xyz: [0.125, 0.125, 0.15]
  # Yaw perturbation (deg). Bumped 20 -> 30 for slightly stronger rotation aug.
  transform_augmentation_rpy: [0.0, 0.0, 30.0]
  num_rotation_classes: 72

rvt:
  place_with_mean: False
  img_aug: 0.0

