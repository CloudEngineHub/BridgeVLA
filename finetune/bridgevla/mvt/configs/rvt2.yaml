# Default mvt config: matches the original BridgeVLA paper (3 axis-aligned
# views top/front/right). Flip rend_three_views to False and
# rend_oblique_views to True to enable the 54.7° magic-angle views
# (view ablation). The two flags are mutually exclusive.
stage_two: True
norm_corr: True
rend_three_views: True
rend_oblique_views: False
use_point_renderer: True
inp_pre_pro: False
inp_pre_con: False
feat_ver: 1
img_size: 224
img_patch_size: 14
cvx_up: True
xops: True
rot_ver: 1
st_wpt_loc_inp_no_noise: True
wpt_img_aug: 0.0
img_aug_2: 0.05
