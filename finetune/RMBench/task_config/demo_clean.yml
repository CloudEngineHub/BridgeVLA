# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: ["aloha-agilex"]
language_num: 1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: LargeView
  wrist_camera_type: LargeView
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: true
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
# ---- Eval recording control ----
# eval_video_log: whether to record (RMBENCH_EVAL_VIDEO=0 also disables it temporarily).
eval_video_log: true
# eval_video_mode: "keyframe" = write 1 frame per keyframe (you only see the still keyframe poses, which looks like teleporting);
#                  "smooth"   = sample physics steps inside the low-level control loop, recording the continuous interpolated motion.
# keyframe is kept as the default so other policies sharing this config are unaffected; switch to smooth if you want smooth video.
eval_video_mode: keyframe
# In smooth mode, write one frame every N physics steps (scene.step, 250 Hz); smaller = smoother and larger files.
eval_video_step_freq: 5
# Playback frame rate. Left empty it follows the mode (keyframe=10, smooth=30).
eval_video_fps: null
